# Jenerated Blue Purple: tmux colors generated by jenerate.py from
# blue-purple-palette.toml. Don't edit this file; change the palette or
# app-themes/tmux-theme/colors.conf.tmpl.
#
# Your tmux.conf loads this with source-file. Every value is quoted, since
# tmux reads an unquoted # as the start of a comment. "set -gq" skips options
# a tmux version doesn't have (popups need 3.3, menus 3.4) instead of
# reporting them as errors.

# The status line: the bar along the bottom, and its window list.
set -gq status-style "fg=#B5BAC1,bg=#0a0b13"
set -gq window-status-style "fg=#6b6f8a,bg=#0a0b13"
set -gq window-status-current-style "fg=#ffffff,bg=#22243d,bold"
set -gq window-status-activity-style "fg=#FEE75D,bg=#0a0b13"
set -gq window-status-bell-style "fg=#ED4246,bg=#0a0b13,bold"

# Pane borders: the active pane's in the accent.
set -gq pane-border-style "fg=#2a2d40"
set -gq pane-active-border-style "fg=#5865F3"

# Messages and the command prompt.
set -gq message-style "fg=#DBDEE1,bg=#191b28"
set -gq message-command-style "fg=#DBDEE1,bg=#191b28"

# Copy mode and the choose-tree and other lists: the selection, and search
# matches (magenta, like search matches in the other themes).
set -gq mode-style "fg=#ffffff,bg=#3c4270"
set -gq copy-mode-match-style "fg=#12131c,bg=#EB459F"
set -gq copy-mode-current-match-style "fg=#12131c,bg=#5865F3"

# Popups (tmux 3.3 and later) and menus (3.4 and later).
set -gq popup-style "fg=#DBDEE1,bg=#191b28"
set -gq popup-border-style "fg=#2a2d40"
set -gq menu-style "fg=#DBDEE1,bg=#191b28"
set -gq menu-selected-style "fg=#ffffff,bg=#5865F3"
set -gq menu-border-style "fg=#2a2d40"

# The clock (prefix t), and the pane numbers (prefix q).
set -gq clock-mode-colour "#5865F3"
set -gq display-panes-colour "#6b6f8a"
set -gq display-panes-active-colour "#5865F3"
