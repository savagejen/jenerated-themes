; Jenerated Blue Purple: Godot editor settings generated by jenerate.py from
; blue-purple-palette.toml. Don't edit this file; change the palette or
; app-themes/godot-theme/editor-settings.cfg.tmpl.
;
; ./setup.sh can apply these to Godot's editor settings for you. To set them
; by hand, open Editor > Editor Settings and set:
;   Interface > Theme > Color Preset: Custom
;   Interface > Theme > Base Color: #161825
;   Interface > Theme > Accent Color: #5865F3
;   Interface > Theme > Contrast: 0.3
;   Text Editor > Theme > Color Theme: Jenerated-blue-purple
;
; Godot 4.6 renamed interface/theme/preset to color_preset, so both are set;
; each version uses the one it knows.

interface/theme/preset = "Custom"
interface/theme/color_preset = "Custom"
interface/theme/base_color = Color(0.0863, 0.0941, 0.1451, 1)
interface/theme/accent_color = Color(0.3451, 0.3961, 0.9529, 1)
interface/theme/contrast = 0.3
text_editor/theme/color_theme = "Jenerated-blue-purple"
