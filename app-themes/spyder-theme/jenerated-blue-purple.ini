; Jenerated Blue Purple: a Spyder syntax highlighting theme generated by
; jenerate.py from blue-purple-palette.toml. Don't edit this file;
; change the palette or app-themes/spyder-theme/scheme.ini.tmpl.
;
; These are the settings of one theme, in Spyder's own format: ./setup.sh
; adds them to Spyder's spyder.ini as a custom theme (custom-0, custom-1 and
; so on). Code colors are (color, bold, italic), and match the VS Code theme.

[appearance]
name = Jenerated Blue Purple
background = #12131c
currentline = #1a1c2a
currentcell = #161825
occurrence = #22243d
ctrlclick = #7289DA
sideareas = #12131c
matched_p = #3c4270
unmatched_p = #ED4246
normal = ('#DBDEE1', False, False)
keyword = ('#7289DA', False, False)
builtin = ('#8593f5', False, False)
definition = ('#8593f5', True, False)
comment = ('#6b6f8a', False, True)
string = ('#57F288', False, False)
number = ('#f2a65a', False, False)
instance = ('#EB459F', False, True)
magic = ('#5865F3', False, False)
