; Jenerated Blue Purple: a fast-syntax-highlighting theme generated by
; jenerate.py from blue-purple-palette.toml. Don't edit this file;
; change the palette or app-themes/zsh-theme/fast-theme.ini.tmpl.
;
; Switch to it with: fast-theme XDG:jenerated-colors
; The colors match the zsh-syntax-highlighting ones in the zsh file.

[base]
default          = none
unknown-token    = #ED4246,bold
commandseparator = #B5BAC1
redirection      = #B5BAC1
here-string-tri  = #FEE75D
here-string-text = #57F288
here-string-var  = #f2a65a
exec-descriptor  = #FEE75D,bold
comment          = #6b6f8a
correct-subtle   = #8593f5
incorrect-subtle = #ED4246
subtle-separator = #B5BAC1
subtle-bg        = bg:#22243d
secondary        =
recursive-base   = none

[command-point]
reserved-word     = #7289DA
subcommand        = #7289DA
alias             = #8593f5
suffix-alias      = #8593f5
global-alias      = #8593f5
builtin           = #8593f5
function          = #8593f5
command           = #8593f5
precommand        = #8593f5,underline
hashed-command    = #8593f5
single-sq-bracket = #7289DA
double-sq-bracket = #7289DA
double-paren      = #7289DA

[paths]
path          = #DBDEE1,underline
pathseparator =
path-to-dir   = #4fd1c5,underline
globbing      = #FEE75D
globbing-ext  = #FEE75D,bold

[brackets]
paired-bracket  = bg:#3c4270
bracket-level-1 = #8593f5,bold
bracket-level-2 = #7289DA,bold
bracket-level-3 = #EB459F,bold

[arguments]
single-hyphen-option   = #f2a65a
double-hyphen-option   = #f2a65a
back-quoted-argument   = none
single-quoted-argument = #57F288
double-quoted-argument = #57F288
dollar-quoted-argument = #57F288
optarg-string          = #57F288
optarg-number          = #f2a65a

[in-string]
back-dollar-quoted-argument           = #f2a65a
back-or-dollar-double-quoted-argument = #f2a65a

[other]
variable             = #9cb2fa
assign               = none
assign-array-bracket = #7289DA
history-expansion    = #EB459F,bold

[math]
mathvar = #9cb2fa
mathnum = #f2a65a
matherr = #ED4246

[for-loop]
forvar  = #9cb2fa
fornum  = #f2a65a
foroper = #B5BAC1
forsep  = #B5BAC1

[case]
case-input       = #9cb2fa
case-parentheses = #7289DA
case-condition   = bg:#22243d
