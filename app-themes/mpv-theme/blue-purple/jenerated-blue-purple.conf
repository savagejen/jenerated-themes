# Jenerated Blue Purple: mpv colors generated by jenerate.py from
# blue-purple-palette.toml. Don't edit this file; change the palette or
# app-themes/mpv-theme/colors.conf.tmpl.
#
# mpv.conf loads this with include="~~/jenerated-colors.conf". Every value is
# quoted: mpv reads an unquoted # as the start of a comment.

# On-screen messages and the OSD bar. (osd-border-color is what mpv called
# osd-outline-color before 0.40, and newer versions still accept it.)
osd-color="#DBDEE1"
osd-border-color="#0a0b13"
osd-back-color="#CC0a0b13"

# The selected item in lists such as the playlist (mpv 0.40 and later; older
# versions report these two as unknown, and read the rest of the file).
osd-selected-color="#7289DA"
osd-selected-outline-color="#0a0b13"

# The on-screen controller (mpv 0.39 and later; older versions say these are
# unknown, and keep their own colors).
script-opts-append="osc-background_color=#0a0b13"
script-opts-append="osc-timecode_color=#5865F3"
script-opts-append="osc-title_color=#DBDEE1"
script-opts-append="osc-time_pos_color=#ffffff"
script-opts-append="osc-time_pos_outline_color=#0a0b13"
script-opts-append="osc-buttons_color=#DBDEE1"
script-opts-append="osc-small_buttonsL_color=#B5BAC1"
script-opts-append="osc-small_buttonsR_color=#B5BAC1"
script-opts-append="osc-top_buttons_color=#B5BAC1"
script-opts-append="osc-held_element_color=#5865F3"

# The console and its menus, such as the track and chapter lists (mpv 0.40
# and later for the matches and outline, 0.41 for the focused item).
script-opts-append="console-focused_color=#ffffff"
script-opts-append="console-focused_back_color=#5865F3"
script-opts-append="console-match_color=#EB459F"
script-opts-append="console-menu_outline_color=#2a2d40"
