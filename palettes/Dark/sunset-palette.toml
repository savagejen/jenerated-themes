# A sunset sky, top to horizon: backgrounds run from blue-black through warm
# aubergine to plum-rose, with a dusk-blue sidebar, accents in sunset orange,
# rose, gold and orchid, and warm peach-cream text.
#
# Every color is a #rrggbb hex value, or the name of another color in this
# file. Templates add transparency themselves (e.g. {{accent}}33).

name = "Sunset"
slug = "sunset"

[colors]
# Backgrounds, darkest to lightest (the sky, from its top to the horizon)
bg_chrome = "#0b0a15"          # activity bar, title bar, status bar
bg_minimap = "#130c19"
bg = "#171523"                 # editor and terminal
bg_sidebar = "#1F2A51"
bg_widget = "#2a1823"          # popups, hovers, notifications
bg_line_highlight = "#25151f"
bg_hover = "#361d2b"           # hovered items, inputs
bg_selected = "#422235"        # inactive selection in lists
bg_secondary_hover = "#5a3048" # hovered secondary buttons
selection = "#72304f"          # selected text in the editor

# Lines
guide = "#2e1a27"              # indent guides, rulers
whitespace = "#3c2433"         # rendered whitespace
border = "#40263a"

# Text, dimmest to brightest
text_faint = "#e0c6c8"         # line numbers, ignored files
text_muted = "#a07f95"         # comments, inactive tabs
text_subtle = "#e0c6c8"        # sidebar text, punctuation
text = "#fbe9df"
text_bright = "#ffffff"        # text on the accent color
text_strong = "text_bright"    # emphasized text: active tabs, selected items

# Accent
accent = "#d1751f"             # cursor, focus, buttons, badges
accent_hover = "#d04a1d"       # hovered buttons
accent_soft = "#ff85a8"        # keywords, links
accent_light = "#ffab6e"       # functions
accent_pale = "#ffd08a"        # properties

# Syntax and status colors
red = "#ff5468"                # errors, deleted
orange = "#ffa04d"             # numbers, parameters, attributes
yellow = "#ffd66b"             # warnings, regex
green = "#a8dc8a"              # strings, added
cyan = "#7fcfd6"               # classes, types
magenta = "#e87ade"            # constants, search matches

# Terminal (ANSI) colors
term_black = "#2a1a26"
term_red = "red"
term_green = "green"
term_yellow = "yellow"
term_blue = "#9a8cf0"          # dusk violet
term_magenta = "magenta"
term_cyan = "cyan"
term_white = "text"
term_bright_black = "text_faint"
term_bright_red = "#ff8c99"
term_bright_green = "#c6ebb2"
term_bright_yellow = "#ffe39e"
term_bright_blue = "#bdb3ff"
term_bright_magenta = "#f3a8ec"
term_bright_cyan = "#aee3e8"
term_bright_white = "text_bright"
