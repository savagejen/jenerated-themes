# Turns on auto-merge for Dependabot's pull requests that update the actions
# the workflows use (see .github/dependabot.yml). GitHub then merges each one
# once the checks the repository requires have passed: the release
# workflow's build, which runs on every pull request.
#
# It runs on pull_request_target, as Dependabot's documentation shows,
# because a pull_request run started by Dependabot only gets a read-only
# token. That trigger has write access, so this never checks out or runs
# anything from the pull request; it only reads Dependabot's description of
# the update and asks GitHub to merge it.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'savagejen/jenerated-themes'
    steps:
      - name: Read what the pull request updates
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      - name: Turn on auto-merge, for updates to actions
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
