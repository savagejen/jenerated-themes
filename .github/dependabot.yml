# The workflows pin each action to an exact commit, with its version in a
# comment beside it, because a version tag like v7 can be moved to
# different code by whoever controls the action. So every new version,
# however small, only arrives through a pull request from Dependabot, which
# updates both the commit and the comment. The release workflow builds and
# tests the packages on each pull request, trying out the updated action,
# and dependabot-automerge.yml merges the pull request once that passes.
#
# The cooldown waits until a new version has been out for 7 days before
# offering it, so a broken or tampered release is likely to be caught and
# pulled before it gets merged here without anyone looking.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
